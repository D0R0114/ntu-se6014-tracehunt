name: M4 MCP tests

on:
  push:
    branches:
      - "m4/**"
    paths:
      - "m4-mcp/**"
      - ".github/workflows/m4-tests.yml"
  pull_request:
    paths:
      - "m4-mcp/**"
      - ".github/workflows/m4-tests.yml"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: m4-mcp/pyproject.toml
      - name: Install M4
        run: python -m pip install -e "./m4-mcp[dev]"
      - name: Unit tests
        run: python -m pytest m4-mcp/tests -q

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: m4-mcp/pyproject.toml
      - name: Install M4
        run: python -m pip install -e "./m4-mcp[dev]"
      - name: Start Elasticsearch 8.12 dev stack
        working-directory: m4-mcp
        run: docker compose -f dev/docker-compose.yml up -d
      - name: Wait for Elasticsearch
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:19200/_cluster/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs tracehunt-m4-es || true
          exit 1
      - name: Seed lab data
        working-directory: m4-mcp
        run: python dev/seed_lab.py http://127.0.0.1:19200
      - name: Elasticsearch integration tests
        working-directory: m4-mcp
        env:
          TRACEHUNT_IT: "1"
          TRACEHUNT_ES_URL: http://127.0.0.1:19200
        run: python -m pytest tests/test_integration.py -q
      - name: MCP stdio smoke test
        working-directory: m4-mcp
        env:
          TRACEHUNT_ES_URL: http://127.0.0.1:19200
        run: python dev/smoke_stdio.py
      - name: Stop dev stack
        if: always()
        working-directory: m4-mcp
        run: docker compose -f dev/docker-compose.yml down -v
